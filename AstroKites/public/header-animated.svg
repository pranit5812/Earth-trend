<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes waveMotion1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-50px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveMotion2 {
        0% { transform: translateX(-30px); }
        50% { transform: translateX(30px); }
        100% { transform: translateX(-30px); }
      }
      @keyframes textShine {
        0%, 100% { fill: #ffffff; }
        50% { fill: #e0f2fe; }
      }
      .star-s1 { animation: twinkle 2.5s ease-in-out infinite; }
      .star-s2 { animation: twinkle 3.2s ease-in-out infinite 0.8s; }
      .star-s3 { animation: twinkle 1.9s ease-in-out infinite 1.4s; }
      .wave1 { animation: waveMotion1 8s ease-in-out infinite; }
      .wave2 { animation: waveMotion2 10s ease-in-out infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
        animation: textShine 4s ease-in-out infinite;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 1.5px;
        fill: #93c5fd;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" fill="url(#bgGrad)" rx="10" />

  <!-- Stars -->
  <g fill="#fde047">
    <circle class="star-s1" cx="120" cy="40" r="1.8" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle class="star-s2" cx="240" cy="70" r="1.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle class="star-s3" cx="380" cy="35" r="2.2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <circle class="star-s1" cx="620" cy="50" r="1.6" opacity="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle class="star-s2" cx="780" cy="30" r="2" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="1.1s" repeatCount="indefinite" />
    </circle>
    <circle class="star-s3" cx="890" cy="65" r="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Waves -->
  <g class="wave1" opacity="0.7">
    <path d="M-100 185 C 150 150, 350 215, 600 175 C 850 135, 1050 200, 1200 180 L 1200 240 L -100 240 Z" fill="url(#waveGrad1)" />
  </g>
  <g class="wave2" opacity="0.85">
    <path d="M-100 200 C 200 225, 450 165, 700 210 C 950 245, 1100 185, 1200 195 L 1200 240 L -100 240 Z" fill="url(#waveGrad2)" />
  </g>

  <!-- Title & Subtitle -->
  <text class="title-text" x="500" y="105" text-anchor="middle" font-size="46" filter="url(#glowText)">AstroKites</text>
  <text class="subtitle-text" x="500" y="145" text-anchor="middle" font-size="16">AI-Powered Weather Forecasting and Historical Climate Analytics</text>
</svg>
