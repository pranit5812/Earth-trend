<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="kiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.35; stroke: #38bdf8; }
        50% { opacity: 0.8; stroke: #60a5fa; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .floating-kite {
        animation: float 4s ease-in-out infinite;
      }
      .ring-pulse {
        animation: pulseRing 3s ease-in-out infinite;
      }
      .twinkle-star {
        animation: twinkle 2s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0f172a"/>
  
  <!-- Outer glowing animated circle -->
  <circle class="ring-pulse" cx="60" cy="60" r="52" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="51; 54; 51" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.35; 0.85; 0.35" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Stars with twinkling animations -->
  <g filter="url(#glow)">
    <path class="twinkle-star" d="M 25 30 L 27 35 L 32 35 L 28 38 L 30 43 L 25 40 L 20 43 L 22 38 L 18 35 L 23 35 Z" fill="url(#starGradient)">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.1s" repeatCount="indefinite" />
    </path>
    <path class="twinkle-star" d="M 95 30 L 97 35 L 102 35 L 98 38 L 100 43 L 95 40 L 90 43 L 92 38 L 88 35 L 93 35 Z" fill="url(#starGradient)">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.8s" begin="0.7s" repeatCount="indefinite" />
    </path>
    <path class="twinkle-star" d="M 100 60 L 101.5 63 L 105 63 L 102 65 L 103 68 L 100 66 L 97 68 L 98 65 L 95 63 L 98.5 63 Z" fill="url(#starGradient)">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.9s" begin="1.2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Kite Group with floating bob animation -->
  <g class="floating-kite">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="4s" repeatCount="indefinite" />
    
    <!-- Main kite diamond -->
    <path d="M 60 20 L 85 55 L 60 90 L 35 55 Z" 
          fill="url(#kiteGradient)" 
          stroke="#93c5fd" 
          stroke-width="2"
          filter="url(#shadow)"/>
    
    <!-- Kite inner ribs -->
    <path d="M 60 20 L 60 90" stroke="#bae6fd" stroke-width="1.8" opacity="0.8"/>
    <path d="M 35 55 L 85 55" stroke="#bae6fd" stroke-width="1.8" opacity="0.8"/>
    
    <!-- Decorative facets -->
    <path d="M 60 20 L 72 55 L 60 55 Z" fill="#1e3a8a" opacity="0.35"/>
    <path d="M 60 20 L 48 55 L 60 55 Z" fill="#60a5fa" opacity="0.35"/>
    
    <!-- Kite tail with sway animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 60 90; 5 60 90; -4 60 90" dur="2.5s" repeatCount="indefinite" />
      <path d="M 60 90 Q 64 97 60 102" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="102" r="3" fill="#fbbf24"/>
      <circle cx="61" cy="107" r="2.5" fill="#38bdf8"/>
      <circle cx="60" cy="111" r="2" fill="#60a5fa"/>
    </g>
  </g>
</svg>
